[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-audio"
version = "1.10.1"
description = "Speech-to-text, speaker diarization, speaker identification, multilingual caption translation, and narration. Local-first: Whisper, NeMo Sortformer, TitaNet, Kokoro, local LLM."
readme = "README.md"
# `<3.14` since 2026-11-01, and it is the one real cost of putting everything
# in the base. `vocal-helper`, `audio-helper`, `video-helper` and
# `speaker-helper` each declare `>=3.10,<3.14` at the floor versions named
# below -- read off the PyPI simple index, not off any installed copy, because
# a floor is not a pin. While they sat behind extras the base install was
# `click` and `langdetect` and resolved on 3.14; a reader who never asked for
# a voice was not refused the interpreter. One `pip install` means the
# ceiling is the package's, so the package says so. The alternative was to
# keep promising 3.14 and hand the reader
# `ERROR: Could not find a version that satisfies the requirement`.
requires-python = ">=3.10,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"}]
keywords = [
    "whisper", "diarization", "speaker-identification",
    "captions", "subtitles", "nemo", "sprezzature", "asr",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Everything this package does installs here: no feature extras since 2026-11-01.
dependencies = [
    "click>=8.1",
    "langdetect>=1.0.9",

    # ---------------------------------------------------------------- la voix
    # Narration is what this package is *for*, so it installs with the
    # package. It sat behind an extra until 2026-11-01, which meant
    # `pip install sprezzature-audio` gave four packages and no voice -- and
    # `[all]` did not even include it, so "install everything" installed a
    # package that could not do the thing it exists to do.
    #
    # **Both engines the router can answer, not just the light one.** The
    # router has no notion of what is installed -- measured:
    # `speaker_helper.router` contains no `check_install`, no `find_spec` and
    # no `importlib` -- it ranks on quality and RTF alone. It answers
    # **chatterbox** for `offline` and **kokoro** for `online_realtime`, in
    # both languages. Shipping kokoro alone would have left the default
    # offline path naming an engine that is not there.
    #
    # The cost is stated rather than hidden: `chatterbox` pulls torch and
    # torchaudio, so every install of this package is a torch install. That is
    # the owner's call, made on 2026-11-01 against the alternative of a voice
    # that is absent when asked for.
    #
    # `detect` is the language detector the router uses to pick a voice per
    # page. Without it a French page is read by an English phonemiser, which
    # is not an accent but an American spelling the words out.
    #
    # The floor is 0.14.1 and the reason is the router's *answer*, not its
    # API. `route()` and `RouteRequest` have existed since 0.8.0, so every
    # earlier floor imported and resolved fine -- and routed differently.
    # `OFFLINE_RATIFIED_ENGINE` arrives in 0.12.0; below it the owner's
    # ratified choice of chatterbox for offline French is not pinned at all,
    # so an install satisfying the old `>=0.11.0` could narrate French in
    # another voice while every import and every test passed. 0.14.1 rather
    # than 0.12.0 because 0.14.1 is the version actually measured: asked for
    # both languages offline it answers chatterbox. Capped `<1` and not
    # `<0.15` because a 0.x minor breaks as freely as a major.
    # `openvoice` joins them, folded in from `[narrate-openvoice]` on
    # 2026-11-01. The extra's own comment used to claim it *had* to stay an
    # extra because OpenVoice ships from GitHub with no wheel of its own --
    # which is true of the *weights* and false of this line: the extra only
    # ever named `speaker-helper[openvoice]`, a perfectly ordinary PyPI extra.
    # The git URL lives in `scripts/requirements-narrate-openvoice.txt`, which
    # `sprezzature-audio-install-voice` reads, and a direct URL is still not
    # allowed in a published wheel's dependencies.
    #
    # Worth recording while folding it, because it is the same shape as the
    # kyutai case closed this morning: `openvoice` is **not in
    # `speaker-helper`'s catalogue at all** -- `default_operating_points()`
    # returns chatterbox, kokoro and kyutai -- so the router can never answer
    # it. It is reachable only by `--engine openvoice`, by hand.
    "speaker-helper[kokoro,detect,chatterbox,openvoice]>=0.14.1,<1",
    # Declared even though `speaker-helper` already pulls it, because
    # `scripts/install_narrate.py` imports `download_file` from it by name:
    # the 325 MB Kokoro graph is fetched through the suite's resumable
    # primitive, so a dropped connection continues instead of starting over.
    # Same reason `sprezzature-video` names it alongside `audio-helper`.
    "os-helper>=4.0.0,<5",

    # ------------------------------------------- l'autre sens : lire la parole
    # Captions and diarisation, folded in from `[captions]` and `[diarize]` on
    # 2026-11-01. `wallet-helper` is the result cache (`scripts/_wallet.py`),
    # and it is here for the one property a hand-rolled read/write pair cannot
    # have: three processes asking to transcribe one file on a cold cache made
    # three whisper loads and three runs of minutes, 2.6 ms apart, and threw
    # two results away. A Sortformer load is a gigabyte of weights and two
    # runs on one recording used to each pay for it.
    "vocal-helper>=0.6.0",
    "audio-helper>=2.6.1,<3",
    "video-helper>=1.7.0",
    # The floor is 1.3.2 and it is load-bearing. Up to and including 1.3.1,
    # `SqliteLedger.__init__` ran `PRAGMA journal_mode=WAL`, which needs
    # exclusive access to the file, and SQLite answers a journal-mode change
    # with SQLITE_BUSY *without consulting the busy handler* -- so the
    # connection's timeout did not cover it. Six processes onto one missing
    # database file collided in two of six rounds, which is the shape
    # `scripts/_wallet.py` documents.
    #
    # `scripts/_wallet.py`'s retry stays, and this floor is what lets its prose
    # say what it is really for: a file that is not a database, which is a disk
    # and not a release. Raising the floor removed the cause, not the defence.
    "wallet-helper>=1.3.2,<2",
    "nemo_toolkit[asr]>=1.23.0",
    "numpy>=1.24",

    # ----------------------------------------------------------- la traduction
    # From `[translate]`. Worth one note that took two readings to get right:
    # `best-engine-ai-helper` declares plain `>=3.10` on the index, so it
    # looks clean -- but its own base names `os-helper` (`>=1.5.0` at 0.4.0,
    # `<5,>=2.9.0` at 1.11.0), and **no
    # os-helper release on PyPI has ever shipped without `<3.14`** (checked
    # across the whole simple index, not sampled). The ceiling arrives one hop
    # down and arrives unavoidably.
    #
    # The floor is 1.11.0 since 2026-11-05, for two reasons read off the index.
    # The translator and the name guesser now pass the server they probed to
    # `chat(engine=...)`, which exists from 1.1.0; and every release from 1.0.0
    # to 1.10.0 caps `os-helper` below 3 or 4, so none of them can install
    # beside the `os-helper>=4` above. 1.11.0 is the first that both accepts
    # `engine=` and allows `os-helper<5`. 0.4.0 resolved only because it named
    # `os-helper>=1.5.0` uncapped, and it had no `engine=`.
    "best-engine-ai-helper>=1.11.0",

    # ------------------------------------------------- les surfaces HTTP et MCP
    # From `[api]` and `[mcp]`. `pydantic` is named because
    # `sprezzature_audio/api.py` does an unguarded
    # `from pydantic import BaseModel, Field`: it resolves today only because
    # fastapi pulls it, and fastapi 0.115.0's own window is `>=1.7.4,<3.0.0`,
    # so a resolver is free to hand this package pydantic 1.x -- a major
    # nothing in this suite has ever run.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "fastapi-mcp>=0.3",
    # fastapi-mcp 0.4.0 declares `mcp>=1.12.0` with no upper bound but calls
    # `Server(name, description)` positionally; mcp 2.0.0 made `description`
    # keyword-only, so an unconstrained resolve breaks `FastApiMCP(...)` at
    # construction. Verified: pip installs mcp 2.2.0 alongside fastapi-mcp
    # 0.4.0 and `sprezzature_audio.mcp` then raises TypeError on import.
    "mcp<2.0",
]

[project.optional-dependencies]
# One, and it is not a feature.
#
# Everything else was folded into the base install on 2026-11-01. The suite
# had 59 extras across eleven repositories and six bricks whose base was a
# single dependency, so `pip install <brick>` installed almost nothing and did
# almost nothing. Choosing the right extra was a thing a reader had to know
# before the package could do its job. One `pip install` now does it.

# The test toolchain. Not part of the product, and putting pytest in the base
# would ship a test runner to every user.
dev = [
    "pytest>=8.0",
    "ruff",
]

[project.urls]
Homepage = "https://sprezzature.ai/"
Repository = "https://github.com/warith-harchaoui/sprezzature-audio"

[project.scripts]
# One front door over the fifteen tools (sprezzature_audio/cli.py), under two
# spellings. `make-audio` is kept because it is what the skill, the README and
# years of notes tell people to type; both names land on the same callable, so
# they cannot drift. There were two parsers until 2026-10-25, an argparse one
# and a click one sharing a table, which meant every sub-command written twice.
# Fifteen commands is well past what anybody keeps in their head, and until a
# front door existed there was no way to find out what this package does except
# by reading its README.
make-audio = "sprezzature_audio.cli:main"
sprezzature-audio = "sprezzature_audio.cli:main"
sprezzature-audio-mcp = "sprezzature_audio.mcp:main"
# The audit half. This package drafts captions; this is what asks whether
# they can be read at the speed they go by.
sprezzature-audio-audit = "sprezzature_audio_scripts.audit_captions:main"
# The other direction: text into speech. Captions make sound readable,
# narration makes text audible, and both land as timed text beside a wav —
# which is why the voices live here rather than beside a site generator.
sprezzature-audio-narrate-kokoro = "sprezzature_audio_scripts.narrate_kokoro:main"
sprezzature-audio-narrate-openvoice = "sprezzature_audio_scripts.narrate_openvoice:main"
sprezzature-audio-narrate-chatterbox = "sprezzature_audio_scripts.narrate_chatterbox:main"
sprezzature-audio-voice = "sprezzature_audio_scripts.pick_voice:main"
sprezzature-audio-install-voice = "sprezzature_audio_scripts.install_narrate:main"
sprezzature-audio-captions = "sprezzature_audio_scripts.captions_from_whisper:main"
sprezzature-audio-diarize = "sprezzature_audio_scripts.diarize_from_nemo:main"
sprezzature-audio-identify = "sprezzature_audio_scripts.identify_from_titanet:main"
sprezzature-audio-pipeline = "sprezzature_audio_scripts.caption_diarize:main"
sprezzature-audio-name = "sprezzature_audio_scripts.name_from_transcript:main"
sprezzature-audio-translate = "sprezzature_audio_scripts.translate_captions:main"
# The two installers set `prog="sprezzature-audio-install"` and
# `prog="sprezzature-audio-install-diarize"` in their own parsers, so their
# --help printed commands nobody could run; EXAMPLES.md sent readers to
# `python scripts/install_captions.py`, a path a wheel does not have. Same
# shape as the caption_diarize mismatch fixed in 1.1.0, missed because the
# guard there was a hand-written list of the six Click commands.
sprezzature-audio-install = "sprezzature_audio_scripts.install_captions:main"
sprezzature-audio-install-diarize = "sprezzature_audio_scripts.install_diarize:main"
# The measuring tool. It had a `main()` and no line here, so it ran from a
# clone and from nowhere else -- which is the one failure mode its own
# docstring argues against: "a measurement tool that is hard to install does
# not get used, and one nobody runs is worse than none, because it lets 'it
# feels faster' stand unchallenged."
sprezzature-audio-benchmark = "sprezzature_audio_scripts.benchmark_stt:main"

[tool.setuptools]
packages = ["sprezzature_audio", "sprezzature_audio_scripts"]

[tool.setuptools.package-dir]
"sprezzature_audio_scripts" = "scripts"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--strict-markers` because the alternative is a marker that does nothing.
# pytest warns about an unknown mark and then runs the test anyway: a typo in
# `@pytest.mark.slow` reads as a marked test and behaves as an unmarked one.
# It cost sprezzature-accessibility seven LLM tests running in every default
# run for weeks, and that repository is the only one of the nine that had the
# flag. The flag is cheap, it fires at collection, and the whole suite now
# carries it -- scripts/test_the_suite_runs_tests_the_same_way.py in the hub
# checks that it still does.
addopts = "-ra --strict-markers"
