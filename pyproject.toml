[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-audio"
version = "1.6.0"
description = "Speech-to-text, speaker diarization, speaker identification, multilingual caption translation, and narration. Local-first: Whisper, NeMo Sortformer, TitaNet, Kokoro, local LLM."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"}]
keywords = [
    "whisper", "diarization", "speaker-identification",
    "captions", "subtitles", "nemo", "sprezzature", "asr",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# No mandatory ML deps — install the extras you need.
dependencies = [
    "click>=8.1",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
captions = [
    "vocal-helper>=0.6.0",
    "audio-helper>=1.6.0",
    "video-helper>=1.7.0",
]
diarize = [
    "nemo_toolkit[asr]>=1.23.0",
    "numpy>=1.24",
    "audio-helper>=1.6.0",
    "video-helper>=1.7.0",
]
translate = [
    "best-engine-ai-helper>=0.4.0",
]
dev = [
    "pytest>=8.0",
    "ruff",
]
all = [
    "sprezzature-audio[captions,diarize,translate]",
]

# HTTP surface (sprezzature_audio/api.py): caption conversion, speaker
# attribution and the WER/DER metrics. Transcription is NOT exposed — it
# loads gigabytes and runs for minutes, which belongs behind a job queue.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# MCP surface: the same routes republished as agent tools, via fastapi-mcp.
mcp = [
    "sprezzature-audio[api]",
    "fastapi-mcp>=0.3",
    # fastapi-mcp 0.4.0 (the latest as of 2026-08) declares mcp>=1.12.0 with
    # no upper bound, but calls mcp's Server(name, description) positionally
    # -- mcp 2.0.0 made `description` keyword-only, so an unconstrained
    # resolve breaks FastApiMCP(...) at construction time (verified: pip
    # happily installs mcp 2.2.0 alongside fastapi-mcp 0.4.0, and
    # `sprezzature_audio.mcp` then raises TypeError on import). Pin below
    # 2.0 until fastapi-mcp ships a fix.
    "mcp<2.0",
]
# Text into speech — the other direction of this package's modality.
#
# Three engines, and they split along a line worth naming: Kokoro *reads*,
# the other two *impersonate*. Reading a page aloud and sounding like a
# particular person are different jobs with different costs, and for years
# the second one's price was charged for both.
#
# `narrate` is Kokoro, and that is the whole extra: 82 M parameters through
# ONNX Runtime, no torch, about 340 MB of weights fetched by
# `sprezzature-audio-install-voice`. Apache-2.0 in code *and* weights, which
# is the bar that ruled out F5-TTS and XTTS-v2.
# The voice lives in `speaker-helper` now: the engines, the espeak-ng
# resolution, the timeline, the cues and the refusals are all there, and this
# package drives them through `scripts/_speaker.py`. Three wrappers of some
# 350 lines each became three of thirty, and the hard-won behaviour is tested
# over there against a backend that needs no model — more coverage than it
# had here.
#
# The floors name 0.11.0, the release that brought the pronunciation lexicon
# and the kyutai backend. They were 0.8.0, the release that first carried
# `Speaker.narrate`; the lexicon is the reason to move, because this suite
# narrates pages full of acronyms -- WebVTT, RTTM, OKLCH, GMTED2010 -- and
# stating a pronunciation once beats hearing four engines each guess
# differently.
narrate = ["speaker-helper[kokoro,detect]>=0.11.0"]
# Kept as a name, because EXAMPLES.md and the installer both say it.
narrate-kokoro = ["sprezzature-audio[narrate]"]
narrate-openvoice = ["speaker-helper[openvoice]>=0.11.0"]
narrate-chatterbox = ["speaker-helper[chatterbox]>=0.11.0"]
# French, natively. `speaker-helper`'s 2026-10 survey picked it for French --
# a Paris lab's model, where the other three reach French through an
# English-first pipeline -- and on a Mac it is served through Kyutai's own MLX
# build, RTF 0.84 against 7.8 on torch-CPU.
#
# An extra rather than the default, and the bar above says why: code MIT,
# weights CC-BY-4.0. Permissive, and not "Apache-2.0 in code *and* weights".
# Ask for it by name and you get a better French voice; nobody gets a
# different licence by surprise.
narrate-kyutai = ["speaker-helper[kyutai]>=0.11.0"]
# OpenVoice ships from git rather than PyPI, so it stays out of the resolvable
# extras above and is installed by `sprezzature-audio-install-voice`, which is
# what that command is for.

[project.urls]
Homepage = "https://sprezzature.ai/"
Repository = "https://github.com/warith-harchaoui/sprezzature-audio"

[project.scripts]
# The two front doors, over the same fifteen tools and the same table
# (sprezzature_audio/cli.py). argparse because it is in the standard library
# and therefore always there; click because its sub-commands carry the shape
# without hand-rolling it. Fifteen commands is well past what anybody keeps
# in their head, and until these existed there was no way to find out what
# this package does except by reading its README.
make-audio = "sprezzature_audio.cli:main"
sprezzature-audio = "sprezzature_audio.cli:main"
sprezzature-audio-mcp = "sprezzature_audio.mcp:main"
# The audit half. This package drafts captions; this is what asks whether
# they can be read at the speed they go by.
sprezzature-audio-audit = "sprezzature_audio_scripts.audit_captions:main"
# The other direction: text into speech. Captions make sound readable,
# narration makes text audible, and both land as timed text beside a wav —
# which is why the voices live here rather than beside a site generator.
sprezzature-audio-narrate-kokoro = "sprezzature_audio_scripts.narrate_kokoro:main"
sprezzature-audio-narrate-openvoice = "sprezzature_audio_scripts.narrate_openvoice:main"
sprezzature-audio-narrate-chatterbox = "sprezzature_audio_scripts.narrate_chatterbox:main"
sprezzature-audio-narrate-kyutai = "sprezzature_audio_scripts.narrate_kyutai:main"
sprezzature-audio-voice = "sprezzature_audio_scripts.pick_voice:main"
sprezzature-audio-install-voice = "sprezzature_audio_scripts.install_narrate:main"
sprezzature-audio-captions = "sprezzature_audio_scripts.captions_from_whisper:main"
sprezzature-audio-diarize = "sprezzature_audio_scripts.diarize_from_nemo:main"
sprezzature-audio-identify = "sprezzature_audio_scripts.identify_from_titanet:main"
sprezzature-audio-pipeline = "sprezzature_audio_scripts.caption_diarize:main"
sprezzature-audio-name = "sprezzature_audio_scripts.name_from_transcript:main"
sprezzature-audio-translate = "sprezzature_audio_scripts.translate_captions:main"
# The two installers set `prog="sprezzature-audio-install"` and
# `prog="sprezzature-audio-install-diarize"` in their own parsers, so their
# --help printed commands nobody could run; EXAMPLES.md sent readers to
# `python scripts/install_captions.py`, a path a wheel does not have. Same
# shape as the caption_diarize mismatch fixed in 1.1.0, missed because the
# guard there was a hand-written list of the six Click commands.
sprezzature-audio-install = "sprezzature_audio_scripts.install_captions:main"
sprezzature-audio-install-diarize = "sprezzature_audio_scripts.install_diarize:main"
# The measuring tool. It had a `main()` and no line here, so it ran from a
# clone and from nowhere else -- which is the one failure mode its own
# docstring argues against: "a measurement tool that is hard to install does
# not get used, and one nobody runs is worse than none, because it lets 'it
# feels faster' stand unchallenged."
sprezzature-audio-benchmark = "sprezzature_audio_scripts.benchmark_stt:main"

[tool.setuptools]
packages = ["sprezzature_audio", "sprezzature_audio_scripts"]

[tool.setuptools.package-dir]
"sprezzature_audio_scripts" = "scripts"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--strict-markers` because the alternative is a marker that does nothing.
# pytest warns about an unknown mark and then runs the test anyway: a typo in
# `@pytest.mark.slow` reads as a marked test and behaves as an unmarked one.
# It cost sprezzature-accessibility seven LLM tests running in every default
# run for weeks, and that repository is the only one of the nine that had the
# flag. The flag is cheap, it fires at collection, and the whole suite now
# carries it -- scripts/test_the_suite_runs_tests_the_same_way.py in the hub
# checks that it still does.
addopts = "-ra --strict-markers"
