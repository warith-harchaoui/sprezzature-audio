[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-audio"
version = "1.0.0"
description = "Speech-to-text, speaker diarization, speaker identification, and multilingual caption translation. Local-first: Whisper, NeMo Sortformer, TitaNet, local LLM."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "Warith HARCHAOUI", email = "warith.harchaoui@gmail.com"}]
keywords = [
    "whisper", "diarization", "speaker-identification",
    "captions", "subtitles", "nemo", "sprezzature", "asr",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# No mandatory ML deps — install the extras you need.
dependencies = [
    "click>=8.1",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
captions = [
    "vocal-helper>=0.6.0",
    "audio-helper>=1.6.0",
    "video-helper>=1.7.0",
]
diarize = [
    "nemo_toolkit[asr]>=1.23.0",
    "numpy>=1.24",
    "audio-helper>=1.6.0",
    "video-helper>=1.7.0",
]
translate = [
    "sprezzature-local>=0.1",
]
dev = [
    "pytest>=8.0",
    "ruff",
]
all = [
    "sprezzature-audio[captions,diarize,translate]",
]

[project.urls]
Homepage = "https://harchaoui.org/warith/sprezzature/"
Repository = "https://github.com/warith-harchaoui/sprezzature-audio"

[project.scripts]
sprezzature-audio-captions = "scripts.captions_from_whisper:main"
sprezzature-audio-diarize = "scripts.diarize_from_nemo:main"
sprezzature-audio-identify = "scripts.identify_from_titanet:main"
sprezzature-audio-pipeline = "scripts.caption_diarize:main"
sprezzature-audio-name = "scripts.name_from_transcript:main"
sprezzature-audio-translate = "scripts.translate_captions:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sprezzature_audio*", "scripts*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
