<svg xmlns="http://www.w3.org/2000/svg" width="980" height="928" viewBox="0 0 980 928" font-family="Roboto, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="audio-hiw-title audio-hiw-desc"><title id="audio-hiw-title">How sprezzature-audio works</title><desc id="audio-hiw-desc">Flow diagram. At the top, a recording or a page of text feeds two lanes. The left lane turns sound into text: it transcribes with a local Whisper build, says who spoke when with NeMo Sortformer, names the speakers against a reference voice, and translates, returning WebVTT, SRT or a plain transcript. The right lane turns text into sound: it detects the language, picks the voice that speaks it, measures each audio file and cuts the cues, returning a WAV and its WebVTT. Both meet in one outcome, the same audit of the cue track whichever direction wrote it.</desc><style>@media (prefers-color-scheme: dark){rect[fill="#FFFFFF"]{fill:#141416;}rect.paper{fill:#0B0B0C;}[fill="#1D1D1F"]{fill:#F2F2F7;}[fill="#6E6E73"]{fill:#9C9CA3;}[stroke="#1D1D1F"]{stroke:#F2F2F7;}[stroke="#C7C7CC"]{stroke:#5A5A5E;}[fill="#C7C7CC"]{fill:#5A5A5E;}rect[fill="#CCE4FF"]{fill:#082646;}rect[fill="#FFEACC"]{fill:#462C09;}}</style><rect class="paper" width="980" height="928" fill="#FFFFFF"/><text x="36" y="52" font-size="28" font-weight="700" fill="#1D1D1F">How sprezzature-audio works</text><text x="36" y="80" font-size="16" font-weight="400" fill="#6E6E73">One modality, read in both directions, entirely on your own machine.</text><rect x="36" y="104" width="908" height="68" rx="12" fill="#FFFFFF" stroke="#8E8E93" stroke-width="1.6" stroke-dasharray="6 5"/><text x="54" y="133" font-size="16" font-weight="600" fill="#1D1D1F">A recording, or a page of text</text><text x="54" y="157" font-size="13.5" font-weight="400" fill="#6E6E73">a meeting, an interview, a lecture. Or the post you want read aloud.</text><path d="M490,172 V192 H254 V204" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,204 L254,212 L258,204" fill="#C7C7CC"/><path d="M490,172 V192 H726 V204" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,204 L726,212 L730,204" fill="#C7C7CC"/><rect x="36" y="212" width="436" height="30" rx="12" fill="#CCE4FF"/><path d="M38,220 v14" stroke="#007AFF" stroke-width="5" stroke-linecap="round" fill="none"/><text x="64" y="232" font-size="15" font-weight="700" fill="#1D1D1F">Sound into text</text><rect x="36" y="258" width="436" height="102" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="286" font-size="16" font-weight="600" fill="#1D1D1F">Transcribe</text><text x="54" y="310" font-size="13.5" font-weight="400" fill="#6E6E73">a local Whisper build through vocal-helper, large-v3-turbo</text><text x="54" y="328" font-size="13.5" font-weight="400" fill="#6E6E73">by default. The audio is pulled down to 16 kHz mono first, which</text><text x="54" y="346" font-size="13.5" font-weight="400" fill="#6E6E73">is what the model expects.</text><path d="M254,360 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,376 L254,384 L258,376" fill="#C7C7CC"/><rect x="36" y="384" width="436" height="102" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="413" font-size="16" font-weight="600" fill="#1D1D1F">Say who spoke when</text><text x="54" y="437" font-size="13.5" font-weight="400" fill="#6E6E73">NeMo Sortformer, up to four speakers, as an RTTM file</text><text x="54" y="454" font-size="13.5" font-weight="400" fill="#6E6E73">and a JSON turn list. TitaNet then matches a voice against a reference</text><text x="54" y="472" font-size="13.5" font-weight="400" fill="#6E6E73">sample and gives it a name.</text><path d="M254,486 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,502 L254,510 L258,502" fill="#C7C7CC"/><rect x="36" y="510" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="540" font-size="16" font-weight="600" fill="#1D1D1F">Translate the cues</text><text x="54" y="564" font-size="13.5" font-weight="400" fill="#6E6E73">a local model, through the same environment variables every</text><text x="54" y="581" font-size="13.5" font-weight="400" fill="#6E6E73">model call in the suite reads</text><path d="M254,596 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,612 L254,620 L258,612" fill="#C7C7CC"/><rect x="36" y="654" width="436" height="68" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><path d="M38,666 v44" stroke="#007AFF" stroke-width="5" stroke-linecap="round" fill="none"/><text x="65" y="684" font-size="16" font-weight="600" fill="#1D1D1F">WebVTT, SRT, or a plain transcript</text><text x="65" y="708" font-size="13.5" font-weight="400" fill="#6E6E73">what was said, by whom, and in which language</text><rect x="508" y="212" width="436" height="30" rx="12" fill="#FFEACC"/><path d="M510,220 v14" stroke="#FF9500" stroke-width="5" stroke-linecap="round" fill="none"/><text x="536" y="232" font-size="15" font-weight="700" fill="#1D1D1F">Text into sound</text><rect x="508" y="258" width="436" height="120" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><text x="526" y="286" font-size="16" font-weight="600" fill="#1D1D1F">Detect the language first</text><text x="526" y="310" font-size="13.5" font-weight="400" fill="#6E6E73">nobody passes one. The detected language is what</text><text x="526" y="328" font-size="13.5" font-weight="400" fill="#6E6E73">the phonemiser works from, so a French page read as English</text><text x="526" y="346" font-size="13.5" font-weight="400" fill="#6E6E73">is not French in an American accent, it is an American spelling</text><text x="526" y="363" font-size="13.5" font-weight="400" fill="#6E6E73">the words out.</text><path d="M726,378 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,394 L726,402 L730,394" fill="#C7C7CC"/><rect x="508" y="402" width="436" height="102" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><text x="526" y="430" font-size="16" font-weight="600" fill="#1D1D1F">Pick the voice that speaks it</text><text x="526" y="454" font-size="13.5" font-weight="400" fill="#6E6E73">fifty-four built-in voices across nine languages. Or one cloned</text><text x="526" y="472" font-size="13.5" font-weight="400" fill="#6E6E73">from a sample of six to thirty seconds, when you need</text><text x="526" y="490" font-size="13.5" font-weight="400" fill="#6E6E73">a particular person rather than a page read aloud.</text><path d="M726,504 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,520 L726,528 L730,520" fill="#C7C7CC"/><rect x="508" y="528" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><text x="526" y="557" font-size="16" font-weight="600" fill="#1D1D1F">Measure the audio, then cut the cues</text><text x="526" y="581" font-size="13.5" font-weight="400" fill="#6E6E73">the WebVTT is built from the measured length of each file. Not</text><text x="526" y="598" font-size="13.5" font-weight="400" fill="#6E6E73">transcribed back, and not typed.</text><path d="M726,613 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,629 L726,637 L730,629" fill="#C7C7CC"/><rect x="508" y="637" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><path d="M510,649 v61" stroke="#FF9500" stroke-width="5" stroke-linecap="round" fill="none"/><text x="537" y="666" font-size="16" font-weight="600" fill="#1D1D1F">A WAV, and its WebVTT beside it</text><text x="537" y="690" font-size="13.5" font-weight="400" fill="#6E6E73">which lands exactly the way a transcript does, so a page can</text><text x="537" y="708" font-size="13.5" font-weight="400" fill="#6E6E73">follow the reading sentence by sentence</text><path d="M254,722 V743 H490 V756" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M486,756 L490,764 L494,756" fill="#C7C7CC"/><path d="M726,722 V743 H490 V756" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M486,756 L490,764 L494,756" fill="#C7C7CC"/><rect x="36" y="764" width="908" height="85" rx="12" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.6"/><path d="M38,776 v61" stroke="#1D1D1F" stroke-width="5" stroke-linecap="round" fill="none"/><text x="65" y="793" font-size="16" font-weight="600" fill="#1D1D1F">Audit the cue track, whichever direction wrote it</text><text x="65" y="817" font-size="13.5" font-weight="400" fill="#6E6E73">Reading speed, overlaps, line width, duration, with exit 1 on any finding. One parser reads both, because a narration and a transcript are</text><text x="65" y="834" font-size="13.5" font-weight="400" fill="#6E6E73">the same file.</text><text x="36" y="875" font-size="13.5" font-weight="400" fill="#6E6E73">Nothing leaves the machine, and there is no key to a remote service to obtain. Signal work, cutting, resampling, separating a voice from music,</text><text x="36" y="892" font-size="13.5" font-weight="400" fill="#6E6E73">belongs to audio-helper; this package starts once the audio is already usable and asks what was said in it.</text></svg>
