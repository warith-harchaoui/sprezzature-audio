name: ci

# Gentle, deterministic gate: ruff, mypy and pytest on one Python, plus an
# install-and-import job on the 3.10 floor. Everything is in the base install
# since 2026-11-01, so the heavy ML libraries are installed here, but no test
# loads a model: the suite covers the model-free paths only.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Une poussée qui en suit une autre annule la première : sans ce groupe, deux
  # commits à une minute d'intervalle font tourner deux matrices de trois
  # versions de Python jusqu'au bout, et seul le second compte. Quatre dépôts
  # de la suite l'avaient, six ne l'avaient pas.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Cran d'arrêt, pas budget : sans lui GitHub laisse courir un job pendu
    # six heures. Aucun des dix dépôts n'en avait.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
      # UNE SEULE version de Python sous la suite complete. La matrice en
      # faisait tourner plusieurs, c'est-a-dire le meme travail multiplie par
      # autant de coureurs pour attraper des differences de version que les
      # tests ne regardent pas. Le plancher garde sa preuve : le job `floor`
      # installe et importe le paquet sur la plus ancienne version promise,
      # ce qui est la promesse faite a `pip install`, pour une fraction du
      # cout.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The package editable. There are no extras left to name: on
          # 2026-11-01 everything this package does moved into the base
          # install, because narration is what it is *for* and `pip install
          # sprezzature-audio` used to give four packages and no voice.
          #
          # **The cost, measured rather than feared: this workflow went from
          # under a minute to two.** The first version of this comment called
          # the step "heavy" and left it at that, which is the kind of warning
          # that cannot be acted on. Two minutes. The sibling numbers from the
          # same day, for scale: `sprezzature-accessibility` did not move at
          # all, `sprezzature-figures` went from 2 to 6 -- and four of those
          # four extra minutes are its wheel-install job, not its tests.
          #
          # The comment here used to say the opposite -- "the heavy extras
          # stay out on purpose: they pull torch and model weights, and none
          # of the deterministic tests need them" -- and it was right about
          # the tests. That option is no longer available: a base install is a
          # base install, and a runner that installs this package installs
          # torch, nemo and whisper whether the tests touch them or not. At
          # two minutes against a 20-minute ceiling, it is not worth buying
          # the option back with a `--no-deps` install that would stop CI
          # checking the base resolves at all.
          #
          # What keeps the suite honest regardless is
          # `test_the_library_surface.py`, which blocks every heavy
          # distribution in a subprocess and proves `import sprezzature_audio`
          # reaches none of them. That check was about extras a reader had not
          # asked for; it is now the only thing standing between a WebVTT
          # parser and a gigabyte of weights.
          pip install -e . -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      # The type half of the gate. Added after running mypy by hand found
      # the same real defect in all six packages: mcp.py's two `main`
      # definitions, the missing-extra fallback and the real one, took
      # different arguments. Once, on one version: this is a gate, not a
      # matrix. scripts/ is a separate invocation because those modules
      # import siblings by bare name off a runtime sys.path.
      - name: Mypy
        if: matrix.python-version == '3.12'
        run: |
          mypy sprezzature_audio
          mypy scripts
      - name: Pytest
        run: pytest -q

  floor:
    name: Plancher (3.10 installe et importe)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `requires-python` est une promesse faite a qui lance `pip install` : sur
    # cette version, le paquet s'installe et s'importe. Installer et importer,
    # deliberement pas la suite de tests — les tests ont le droit d'employer des
    # nouveautes de langage, et faire echouer le plancher la-dessus ferait
    # echouer un job pour une raison etrangere a la promesse.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install .
      - run: python -c "import sprezzature_audio"
