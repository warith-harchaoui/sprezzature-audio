name: ci

# Gentle, deterministic gate: ruff lint + pytest on the supported Python
# versions. The heavy ML extras (captions / diarize) are not installed or
# exercised here — the tests cover the light, model-free helpers only.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The package editable, with the two light surfaces it advertises.
          # Without [api,mcp] every test of api.py and mcp.py skipped and CI
          # was green on code nobody ran. The heavy extras (captions,
          # diarize, translate) stay out on purpose: they pull torch and
          # model weights, and none of the deterministic tests need them.
          pip install -e ".[api,mcp]" -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      # The type half of the gate. Added after running mypy by hand found
      # the same real defect in all six packages: mcp.py's two `main`
      # definitions, the missing-extra fallback and the real one, took
      # different arguments. Once, on one version: this is a gate, not a
      # matrix. scripts/ is a separate invocation because those modules
      # import siblings by bare name off a runtime sys.path.
      - name: Mypy
        if: matrix.python-version == '3.12'
        run: |
          mypy sprezzature_audio
          mypy scripts
      - name: Pytest
        run: pytest -q
