name: ci

# Gentle, deterministic gate: ruff lint + pytest on the supported Python
# versions. The heavy ML extras (captions / diarize) are not installed or
# exercised here — the tests cover the light, model-free helpers only.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Une poussée qui en suit une autre annule la première : sans ce groupe, deux
  # commits à une minute d'intervalle font tourner deux matrices de trois
  # versions de Python jusqu'au bout, et seul le second compte. Quatre dépôts
  # de la suite l'avaient, six ne l'avaient pas.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Cran d'arrêt, pas budget : sans lui GitHub laisse courir un job pendu
    # six heures. Aucun des dix dépôts n'en avait.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The package editable. There are no extras left to name: on
          # 2026-11-01 everything this package does moved into the base
          # install, because narration is what it is *for* and `pip install
          # sprezzature-audio` used to give four packages and no voice.
          #
          # **That makes this step heavy, and the trade is deliberate.** The
          # comment here used to say the opposite -- "the heavy extras stay
          # out on purpose: they pull torch and model weights, and none of the
          # deterministic tests need them" -- and it was right about the
          # tests. It is no longer available: a base install is a base
          # install, and a runner that installs this package installs torch,
          # nemo and whisper whether the tests touch them or not.
          #
          # What keeps the suite honest regardless is
          # `test_the_library_surface.py`, which blocks every heavy
          # distribution in a subprocess and proves `import sprezzature_audio`
          # reaches none of them. That check was about extras a reader had not
          # asked for; it is now the only thing standing between a WebVTT
          # parser and a gigabyte of weights.
          pip install -e . -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      # The type half of the gate. Added after running mypy by hand found
      # the same real defect in all six packages: mcp.py's two `main`
      # definitions, the missing-extra fallback and the real one, took
      # different arguments. Once, on one version: this is a gate, not a
      # matrix. scripts/ is a separate invocation because those modules
      # import siblings by bare name off a runtime sys.path.
      - name: Mypy
        if: matrix.python-version == '3.12'
        run: |
          mypy sprezzature_audio
          mypy scripts
      - name: Pytest
        run: pytest -q
